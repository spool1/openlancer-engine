name: PR check

concurrency:
  group: pullrequests
  
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: librelancer-runner
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    - name: Install native dependencies
      run: apt-get update && apt-get install -y libgtk-3-dev g++-mingw-w64-x86-64 cmake libopenal1 build-essential zip
    - name: Build and Test
      run: ./build.sh -j$(nproc) BuildAndTest --with-win64
